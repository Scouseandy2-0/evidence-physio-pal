<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123c67">
  <meta name="description" content="PhysioSidekick — your companion, from study to practice. Research and learning review prototype.">
  <meta name="robots" content="noindex,nofollow">
  <title>PhysioSidekick · From study to practice</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PhysioSidekick">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a href="#main" class="skip">Skip to workspace</a>
  <aside class="sidebar" aria-label="Workspace navigation">
    <a class="brand" href="#home"><span class="brand-symbol" aria-hidden="true">s<span>+</span></span><span>Physio<span class="brand-light">Sidekick</span><small>FROM STUDY TO PRACTICE</small></span></a>
    <span class="nav-label">YOUR WORKSPACE</span>
    <nav id="desktop-nav"></nav>
    <div class="sidebar-bottom"><div class="build-label">EARLY ACCESS</div><p>One place to keep<br>your knowledge growing.</p><button class="quiet-button" id="about-button">About this prototype</button></div>
    <div class="profile"><span class="avatar" aria-hidden="true">PS</span><div><strong>Your workspace</strong><small>Review prototype</small></div></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><a class="mobile-brand" href="#home">Physio<strong>Sidekick</strong><span>+</span></a><div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb">Overview</strong></div><div class="header-actions"><button class="private-label sync-label" id="sync-status" type="button">Connecting…</button><button class="icon-button" id="open-workspace-search" aria-label="Search my workspace"></button><button class="icon-button" id="open-library" aria-label="Open saved papers"></button></div></header>
    <div id="sync-banner" role="status" aria-live="polite"></div><main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>Built for curious minds. Grounded in real sources.</span><button class="text-button" id="readiness-button">Review this version</button><button class="text-button" id="guide-button">Getting started</button><button class="text-button" id="report-button">Report a problem</button><button class="text-button" id="reading-button">Reading & iPhone setup</button><button class="text-button" id="data-button">Your data & privacy</button></footer>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  <dialog id="detail-dialog" aria-modal="true" aria-labelledby="dialog-title"><div id="dialog-content"></div><button class="dialog-close icon-button" aria-label="Close dialog">✕</button></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
